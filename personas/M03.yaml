id: M03
name: 一般意识功效导向型
budget_band: "mid"

# 原型: 人群3=关注意识一般，问题解决
# 代表: 臧女士(32岁/互联网翻译/月入4万), 罗女士(30岁/个体老板/月入2万),
#       黄女士(34岁/金融业务员/月入4万), 杨女士(32岁/鞋服业务/月入1.5万),
#       张女士(26岁/电商财务/月入2万)
# 特征: 功效导向, 会做功课但主要靠线上评测, 对症下药, 品牌加分项, 品牌不忠诚

decision_weights:
  efficacy_clarity: 0.35
  trust_signal: 0.25
  convenience: 0.15
  price_fit: 0.25

veto_trigger: "功效含糊 / 安全存疑 / 配方有争议成分"

veto_rules:
  - code: "vague_efficacy"
    description: "功效含糊不清，无法判断实际效果"
  - code: "safety_concern"
    description: "产品安全性存疑"
  - code: "controversial_formula"
    description: "配方含争议成分（如过量氟化物）"

feature_scoring_rubric:
  efficacy_clarity:
    5: "功效明确有依据，能针对具体口腔问题（防蛀/清新口气/美白），有评测数据"
    3: "功效表述一般，知道能做什么但缺乏详细对比"
    1: "功效说得太花哨或含糊，无法判断真实效果"
  trust_signal:
    5: "有老爸测评/崔玉涛等权威推荐，或进口专业品牌背书"
    3: "品牌一般但正规，没有特别的信任加分"
    1: "完全新品牌，没有任何推荐来源"
  convenience:
    5: "分年龄段设计，产品使用简单，孩子容易接受"
    3: "正常使用，需要一些引导"
    1: "使用复杂，孩子抗拒"
  price_fit:
    5: "功效明确，价格合理，值这个钱"
    3: "价格适中，但功效没有明显优势"
    1: "太贵了，功效不值这个价"
